server:
  addr: ":8080"
  mode: "debug"          # debug | release
  read_timeout: 15s
  write_timeout: 120s    # SSE 需要长写超时
  shutdown_timeout: 10s

mysql:
  dsn: "root:root@tcp(127.0.0.1:3306)/ai_health?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s"
  max_open: 25
  max_idle: 10
  slow_threshold: 200ms

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20

jwt:
  secret: ""             # 必填，>=32 字节，生产用 AIH_JWT_SECRET 注入
  issuer: "ai-health"
  access_ttl: 2h
  refresh_ttl: 168h

ai:
  # 国内大模型优先（均为 OpenAI 兼容的 /chat/completions 协议）：
  #   deepseek → https://api.deepseek.com/v1                        deepseek-chat
  #   qwen     → https://dashscope.aliyuncs.com/compatible-mode/v1  qwen-plus
  #   glm      → https://open.bigmodel.cn/api/paas/v4               glm-4-flash
  #   moonshot → https://api.moonshot.cn/v1                         moonshot-v1-8k
  # 备用 openai；mock 为离线开发（不调外部接口，开箱可跑）
  provider: "mock"
  base_url: ""           # 留空按 provider 预置端点，一般无需手填
  api_key: ""            # 用 AIH_AI_API_KEY 注入，切勿提交到仓库
  model: ""              # 留空按 provider 预置模型
  timeout: 60s
  max_tokens: 1024
  temperature: 0.3
  history_limit: 10

cors:
  allow_origins:
    - "http://localhost:5173"

log:
  level: "info"
  format: "console"      # console | json