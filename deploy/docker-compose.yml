name: ai-health

services:
  mysql:
    image: mysql:8.0
    container_name: aihealth-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ai_health
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aihealth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: aihealth-migrate
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - "mysql://root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/ai_health?multiStatements=true"
      - up
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aihealth-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      AIH_SERVER_MODE: release
      AIH_MYSQL_DSN: "aihealth:${MYSQL_PASSWORD:-aihealth123}@tcp(mysql:3306)/ai_health?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true"
      AIH_REDIS_ADDR: "redis:6379"
      AIH_JWT_SECRET: "${JWT_SECRET:-please-change-me-to-a-32-bytes-secret}"
      AIH_AI_PROVIDER: "${AI_PROVIDER:-mock}"
      AIH_AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AIH_AI_API_KEY: "${AI_API_KEY:-}"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    container_name: aihealth-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
